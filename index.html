<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一至四年級體育課計分系統</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f4f8; padding: 15px; box-sizing: border-box; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 25px; font-size: 24px;}
        h3 { color: #34495e; margin-top: 0; font-size: 18px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;}
        
        .content-wrapper { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; box-sizing: border-box; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #4a5568; font-size: 14px;}
        .form-group input[type="text"], .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        
        input[type="file"] { display: block; width: 100%; padding: 8px; font-size: 14px; border: 1px dashed #a0aec0; border-radius: 6px; background-color: #f7fafc; cursor: pointer; }
        
        .table-card { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; min-width: 900px; }
        th, td { border: 1px solid #e2e8f0; padding: 8px 4px; text-align: center; vertical-align: middle; }
        th { background-color: #edf2f7; position: sticky; top: 0; color: #2d3748; z-index: 10; }
        
        input[type="number"] { width: 60px; text-align: center; font-size: 14px; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; }
        td select { width: 65px; font-size: 14px; padding: 6px; border: 1px solid #cbd5e0; border-radius: 4px; }
        
        .grade-cell { font-weight: bold; font-size: 18px; color: #e53e3e; }

        .action-buttons { text-align: center; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        @media (min-width: 600px) {
            .action-buttons { flex-direction: row; justify-content: center; gap: 15px; }
            .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        }

        button { color: white; padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; max-width: 250px; box-sizing: border-box; transition: background-color 0.2s; }
        
        button.primary-btn { background-color: #3182ce; }
        button.primary-btn:hover { background-color: #2b6cb0; }
        button.success-btn { background-color: #38a169; }
        button.success-btn:hover { background-color: #2f855a; }
        button.danger-btn { background-color: #e53e3e; }
        button.danger-btn:hover { background-color: #c53030; }

        .alert { background-color: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center; font-weight: bold;}
        .small-text { font-size: 12px; color: #718096; margin-top: 4px; display: block; }
    </style>
</head>
<body>

    <h1>🏃‍♂️ 一至四年級體育課計分系統</h1>

    <div class="content-wrapper">
        <div class="card settings-card">
            <div class="tools-grid">
                <div>
                    <h3>📝 步驟 1：匯入 Excel 檔案</h3>
                    <div class="form-group">
                        <label>選擇本學期體適能項目 (佔 40%)</label>
                        <select id="fitnessType" onchange="autoSave()">
                            <option value="run">耐力跑 (圈數)</option>
                            <option value="situp">仰卧起坐 (次)</option>
                            <option value="reach">坐地前身 (cm)</option>
                            <option value="grip">手握力 (kg)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>上傳 Excel 檔案 (空白名單 / 之前匯出的成績單)</label>
                        <input type="file" id="fileUpload" accept=".xlsx, .xls">
                        <span class="small-text">※ 支援匯入全新的班名單，也支援匯入之前從本系統下載、打分到一半的 Excel 成績單來繼續工作。</span>
                    </div>
                </div>

                <div>
                    <h3>⚠️ 系統狀態管理</h3>
                    <div class="form-group" style="margin-top: 30px;">
                        <span class="small-text" style="margin-bottom: 10px;">如果畫面上的資料有誤，或者想重新開始，可點擊下方按鈕清除瀏覽器暫存：</span>
                        <button class="danger-btn" onclick="clearData()" style="width:100%; max-width: 100%;">🗑️ 清除暫存資料</button>
                    </div>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
            
            <h3>📝 步驟 2：輸入考核題目</h3>
            <div class="tools-grid">
                <div class="form-group">
                    <label>技能考核題目 1</label>
                    <input type="text" id="skill1" value="籃球運球" oninput="autoSave(); updateHeaders();">
                </div>
                <div class="form-group">
                    <label>技能考核題目 2</label>
                    <input type="text" id="skill2" value="籃球投籃" oninput="autoSave(); updateHeaders();">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>知識考核題目</label>
                    <input type="text" id="knowledge" value="運動安全知識" oninput="autoSave(); updateHeaders();">
                </div>
            </div>
        </div>

        <div class="card table-card" id="tableCard">
            <h3>👨‍🎓 學生評分表 <span id="saveStatus" style="font-size: 12px; color: #38a169; float: right; margin-top: 4px;">✅ 已自動儲存</span></h3>
            <div class="alert" id="tableAlert">請先在上方上傳 Excel 檔案。</div>
            
            <div id="tableContainer"></div>
            
            <div class="action-buttons">
                <button id="calcBtn" class="primary-btn" style="display:none;" onclick="calculateScores()">🧮 結算總成績與評級</button>
                <button id="exportBtn" class="success-btn" style="display:none;" onclick="exportExcel()">📊 匯出進度/成績單 (Excel)</button>
            </div>
        </div>
    </div>

    <script>
        let appState = {
            settings: {
                fitnessType: 'run',
                skill1: '籃球運球',
                skill2: '籃球投籃',
                knowledge: '運動安全知識'
            },
            students: []
        };

        window.onload = function() {
            let savedState = localStorage.getItem('peGradingState_v3');
            if (savedState) {
                try {
                    appState = JSON.parse(savedState);
                    restoreUIFromState();
                    if (appState.students.length > 0) {
                        renderTable();
                        calculateScores(false); 
                    }
                } catch (e) {
                    console.error("載入暫存失敗", e);
                }
            }
        };

        function saveStateToLocal() {
            localStorage.setItem('peGradingState_v3', JSON.stringify(appState));
            let status = document.getElementById('saveStatus');
            status.innerText = "✅ 自動儲存成功 (" + new Date().toLocaleTimeString() + ")";
            status.style.color = "#38a169";
        }

        function autoSave() {
            appState.settings.fitnessType = document.getElementById('fitnessType').value;
            appState.settings.skill1 = document.getElementById('skill1').value;
            appState.settings.skill2 = document.getElementById('skill2').value;
            appState.settings.knowledge = document.getElementById('knowledge').value;

            if (appState.students.length > 0) {
                let table = document.getElementById('scoreTable');
                if (table) {
                    let rows = table.getElementsByTagName('tbody')[0].rows;
                    for (let i = 0; i < rows.length; i++) {
                        let cells = rows[i].cells;
                        appState.students[i].fitnessVal = parseFloat(cells[3].querySelector('input').value) || 0;
                        appState.students[i].skill1Val = parseInt(cells[4].querySelector('select').value) || 0;
                        appState.students[i].skill2Val = parseInt(cells[5].querySelector('select').value) || 0;
                        appState.students[i].knowledgeVal = parseInt(cells[6].querySelector('select').value) || 0;
                        appState.students[i].attireVal = parseInt(cells[7].querySelector('select').value) || 0;
                        appState.students[i].participationVal = parseInt(cells[8].querySelector('select').value) || 0;
                    }
                }
            }
            saveStateToLocal();
        }

        function updateHeaders() {
            if(document.getElementById('th-skill1')) document.getElementById('th-skill1').innerHTML = `技能一<br>${document.getElementById('skill1').value}<br><small>0-20分</small>`;
            if(document.getElementById('th-skill2')) document.getElementById('th-skill2').innerHTML = `技能二<br>${document.getElementById('skill2').value}<br><small>0-20分</small>`;
            if(document.getElementById('th-knowledge')) document.getElementById('th-knowledge').innerHTML = `知識<br>${document.getElementById('knowledge').value}<br><small>0-10分</small>`;
        }

        function restoreUIFromState() {
            document.getElementById('fitnessType').value = appState.settings.fitnessType;
            document.getElementById('skill1').value = appState.settings.skill1;
            document.getElementById('skill2').value = appState.settings.skill2;
            document.getElementById('knowledge').value = appState.settings.knowledge;
        }

        function generateSelect(maxScore, defaultValue) {
            let options = '';
            for (let i = 0; i <= maxScore; i++) {
                let selected = (i === defaultValue) ? 'selected' : '';
                options += `<option value="${i}" ${selected}>${i}</option>`;
            }
            return `<select onchange="autoSave()">${options}</select>`;
        }

        // 解析匯入的 Excel (支援空白名單與已有成績的名單)
        document.getElementById('fileUpload').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let worksheet = workbook.Sheets[workbook.SheetNames[0]];
                
                // 為了抓取原始表頭名稱，我們使用 header: 1
                let rawDataArr = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                if (rawDataArr.length < 2) {
                    alert("Excel 檔案內容為空或格式不正確！");
                    document.getElementById('fileUpload').value = "";
                    return;
                }

                let headers = rawDataArr[0]; // 第一行是表頭
                let records = rawDataArr.slice(1); // 剩下的資料

                // 尋找必要欄位的索引
                let nameIdx = headers.findIndex(h => h && h.toString().includes('姓名'));
                if (nameIdx === -1) {
                    alert('Excel 檔案中找不到「姓名」欄位，請檢查檔案格式！');
                    document.getElementById('fileUpload').value = "";
                    return;
                }

                // 嘗試尋找其他欄位索引，找不到則為 -1
                let classIdx = headers.findIndex(h => h && (h.toString().includes('班別') || h.toString().includes('班級')));
                let studentNoIdx = headers.findIndex(h => h && h.toString().includes('學號'));
                
                // 嘗試尋找成績欄位 (用於還原進度)
                let fitnessIdx = headers.findIndex(h => h && h.toString().includes('體適能'));
                let skill1Idx = headers.findIndex(h => h && h.toString().includes('技能一'));
                let skill2Idx = headers.findIndex(h => h && h.toString().includes('技能二'));
                let knowledgeIdx = headers.findIndex(h => h && h.toString().includes('知識'));
                let attireIdx = headers.findIndex(h => h && h.toString().includes('服裝'));
                let participationIdx = headers.findIndex(h => h && h.toString().includes('參與'));

                appState.students = records.map(row => {
                    // 安全取值函數，避免 undefined
                    let getVal = (idx, defaultVal) => (idx !== -1 && row[idx] !== undefined) ? row[idx] : defaultVal;
                    
                    return {
                        class: getVal(classIdx, '-'),
                        studentNo: getVal(studentNoIdx, '-'),
                        name: row[nameIdx],
                        // 如果有找到成績欄位，就匯入數字；如果沒有，就預設為 0 或 5
                        fitnessVal: parseFloat(getVal(fitnessIdx, 0)) || 0,
                        skill1Val: parseInt(getVal(skill1Idx, 0)) || 0,
                        skill2Val: parseInt(getVal(skill2Idx, 0)) || 0,
                        knowledgeVal: parseInt(getVal(knowledgeIdx, 0)) || 0,
                        attireVal: parseInt(getVal(attireIdx, 5)) || 5, // 預設 5
                        participationVal: parseInt(getVal(participationIdx, 5)) || 5, // 預設 5
                        totalScore: 0, 
                        grade: '-'
                    };
                });
                
                autoSave();
                renderTable();
                calculateScores(false); // 載入後自動算一次
                alert("Excel 檔案讀取成功！");
                document.getElementById('fileUpload').value = ""; // 清空上傳框以便下次可以選同一個檔
            };
            reader.readAsArrayBuffer(file);
        });

        function clearData() {
            if(confirm("⚠️ 確定要清除所有暫存資料嗎？這會把目前的評分表全部清空！建議先匯出。")) {
                localStorage.removeItem('peGradingState_v3');
                location.reload(); 
            }
        }

        function renderTable() {
            if (appState.students.length === 0) return;
            document.getElementById('tableAlert').style.display = 'none';

            let fitnessTypeLabel = document.getElementById('fitnessType').options[document.getElementById('fitnessType').selectedIndex].text;
            
            let html = '<table id="scoreTable"><thead><tr>';
            html += '<th>班別</th><th>學號</th><th>姓名</th>';
            html += `<th id="th-fitness">${fitnessTypeLabel}<br><small>(請輸入數據)</small></th>`;
            html += `<th id="th-skill1">技能一<br>${appState.settings.skill1}<br><small>0-20分</small></th>`;
            html += `<th id="th-skill2">技能二<br>${appState.settings.skill2}<br><small>0-20分</small></th>`;
            html += `<th id="th-knowledge">知識<br>${appState.settings.knowledge}<br><small>0-10分</small></th>`;
            html += '<th>態度:服裝<br><small>0-5分</small></th>';
            html += '<th>態度:參與<br><small>0-5分</small></th>';
            html += '<th>總分</th>';
            html += '<th>評級</th>';
            html += '</tr></thead><tbody>';

            appState.students.forEach((student, index) => {
                html += `<tr>`;
                html += `<td>${student.class}</td>`;
                html += `<td>${student.studentNo}</td>`;
                html += `<td>${student.name}</td>`;
                html += `<td><input type="number" step="0.1" value="${student.fitnessVal}" onchange="autoSave()"></td>`;
                html += `<td>${generateSelect(20, student.skill1Val)}</td>`;
                html += `<td>${generateSelect(20, student.skill2Val)}</td>`;
                html += `<td>${generateSelect(10, student.knowledgeVal)}</td>`;
                html += `<td>${generateSelect(5, student.attireVal)}</td>`;
                html += `<td>${generateSelect(5, student.participationVal)}</td>`;
                
                html += `<td class="total-score-cell">${student.totalScore || '-'}</td>`;
                html += `<td class="grade-cell">${student.grade || '-'}</td>`;
                html += `</tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
            
            document.getElementById('calcBtn').style.display = 'inline-block';
            document.getElementById('exportBtn').style.display = 'inline-block';
        }

        function getFitnessScore(type, val) {
            val = parseFloat(val) || 0;
            if (type === 'run') {
                let dist = val * 60;
                if (dist < 640) return 0;
                if (dist <= 709) return 8;
                if (dist <= 769) return 16;
                if (dist <= 839) return 24;
                if (dist <= 889) return 32;
                return 40;
            } else if (type === 'situp') {
                if (val <= 4) return 8;
                if (val <= 8) return 16;
                if (val <= 13) return 24;
                if (val <= 21) return 32;
                return 40;
            } else if (type === 'reach') {
                if (val <= 12) return 0;
                if (val <= 17) return 8;
                if (val <= 22) return 16;
                if (val <= 27) return 24;
                if (val <= 32) return 32;
                return 40;
            } else if (type === 'grip') {
                if (val <= 12.4) return 0;
                if (val <= 13.9) return 8;
                if (val <= 16.4) return 16;
                if (val <= 19.4) return 24;
                if (val <= 21.4) return 32;
                return 40;
            }
            return 0;
        }

        function getGrade(score) {
            if (score >= 90) return 'A';
            if (score >= 80) return 'A-';
            if (score >= 70) return 'B+';
            if (score >= 60) return 'B';
            if (score >= 50) return 'B-';
            return 'C+';
        }

        function calculateScores(showAlert = true) {
            autoSave(); 
            let table = document.getElementById('scoreTable');
            if (!table) return;

            let fitnessType = appState.settings.fitnessType;
            let rows = table.getElementsByTagName('tbody')[0].rows;

            for (let i = 0; i < rows.length; i++) {
                let s = appState.students[i];
                let cells = rows[i].cells;
                
                let fitnessScore = getFitnessScore(fitnessType, s.fitnessVal);
                let total = fitnessScore + s.skill1Val + s.skill2Val + s.knowledgeVal + s.attireVal + s.participationVal;
                let grade = getGrade(total);

                s.totalScore = total;
                s.grade = grade;

                cells[9].innerHTML = `<b>${total}</b><br><small style="color:gray; font-weight:normal;">(適能得${fitnessScore}分)</small>`;
                
                let gradeColor = '#e53e3e'; 
                if(grade.includes('A')) gradeColor = '#38a169'; 
                else if(grade.includes('B')) gradeColor = '#3182ce'; 
                
                cells[10].innerHTML = `<span style="color:${gradeColor};">${grade}</span>`;
            }
            saveStateToLocal(); 
            
            if(showAlert) alert("結算完成！請檢查右側的總分與評級。");
        }

        // 匯出為 Excel，確保表頭名稱固定，方便下次匯入識別
        function exportExcel() {
            autoSave(); 
            calculateScores(false); 
            
            let exportData = [];
            
            // 建立乾淨的資料陣列供匯出
            appState.students.forEach(s => {
                exportData.push({
                    "班別": s.class,
                    "學號": s.studentNo,
                    "姓名": s.name,
                    "體適能 (數據)": s.fitnessVal,
                    "技能一": s.skill1Val,
                    "技能二": s.skill2Val,
                    "知識": s.knowledgeVal,
                    "態度:服裝": s.attireVal,
                    "態度:參與": s.participationVal,
                    "總分": s.totalScore,
                    "評級": s.grade
                });
            });

            let ws = XLSX.utils.json_to_sheet(exportData);
            
            ws['!cols'] = [
                {wch: 8},  {wch: 10}, {wch: 12}, 
                {wch: 15}, {wch: 10}, {wch: 10}, 
                {wch: 10}, {wch: 12}, {wch: 12}, 
                {wch: 8},  {wch: 8}   
            ];

            let wb = XLSX.utils.book_new();
            XLSX.book_append_sheet(wb, ws, "體育成績單");
            
            // 檔名加上日期，方便管理版本
            let dateStr = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `體育成績單_${appState.settings.fitnessType}_${dateStr}.xlsx`);
        }
    </script>
</body>
</html>
